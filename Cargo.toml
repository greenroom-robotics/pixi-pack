[package]
name = "pixi-pack"
description = "A command line tool to pack and unpack conda environments for easy sharing"
version = "0.7.11"
edition = "2024"

# See https://doc.rust-lang.org/cargo/reference/profiles.html
[profile.release]
codegen-units = 1
lto = true
strip = true
opt-level = "z"

[features]
default = ["native-tls"]
native-tls = [
  "reqwest/native-tls",
  "rattler/native-tls",
  "rattler_networking/native-tls",
  "rattler_package_streaming/native-tls",
]
rustls = [
  "reqwest/rustls",
  "rattler/rustls",
  "rattler_networking/rustls",
  "rattler_package_streaming/rustls",
]

[dependencies]
anyhow = "1.0.102"
clap = { version = "4.6.1", features = ["derive", "string"] }
clap_complete = "4.6.5"
clap-verbosity-flag = { version = "3.0.4", features = ["tracing"] }
futures = "0.3.32"
indicatif = "0.18.4"
rattler = { version = "0.48.2", default-features = false }
rattler_config = "0.7.0"
rattler_digest = { version = "1.3.2", features = ["tokio"] }
rattler_conda_types = "0.52.1"
rattler_index = "0.31.0"
rattler_lock = "0.32.1"
rattler_networking = { version = "0.30.3", default-features = false, features = [
  "s3",
  "gcs",
  "azure",
  "rattler_config",
  "system-integration",
] }
rattler_package_streaming = { version = "0.27.0", default-features = false }
rattler_shell = "0.27.13"
reqwest = { version = "0.13.3", default-features = false, features = ["http2"] }
reqwest-middleware = { package = "astral-reqwest-middleware", version = "0.5.1" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
serde_yaml = "0.9.34" # todo: use a non-deprecated crate
tokio = { version = "1.52.3", features = ["rt-multi-thread"] }
tokio-stream = { version = "0.1.18", features = ["fs"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = [
  "default",
  "env-filter",
] }
url = "2.5.8"
tempfile = "3.27.0"
walkdir = "2.5.0"
tar = "0.4.46"
base64 = "0.23.0"
indexmap = "2.14.0"
ahash = "0.8.12"
uv-build-frontend = "0.0.57"
uv-cache = "0.0.57"
uv-client = "0.0.57"
uv-configuration = "0.0.57"
uv-dispatch = "0.0.57"
uv-distribution = "0.0.57"
uv-distribution-filename = "0.0.57"
uv-distribution-types = "0.0.57"
uv-git = "0.0.57"
uv-installer = "0.0.57"
uv-pep508 = "0.0.57"
uv-preview = "0.0.57"
uv-python = "0.0.57"
uv-types = "0.0.57"
uv-workspace = "0.0.57"

[dev-dependencies]
async-std = "1.13.2"
rstest = "0.26.1"
sha2 = "0.11.0"
insta = "1.47.2"
serial_test = "4.0.1"

# Every rattler crate must resolve from the same fork rev, or shared types
# like `RepoDataRecord` exist twice and fail to unify.
[patch.crates-io]
file_url = { git = "https://github.com/greenroom-robotics/rattler", rev = "34ec0e6fae9743f1c8dd5b2838ef2878a6685a0b" }
path_resolver = { git = "https://github.com/greenroom-robotics/rattler", rev = "34ec0e6fae9743f1c8dd5b2838ef2878a6685a0b" }
rattler = { git = "https://github.com/greenroom-robotics/rattler", rev = "34ec0e6fae9743f1c8dd5b2838ef2878a6685a0b" }
rattler_cache = { git = "https://github.com/greenroom-robotics/rattler", rev = "34ec0e6fae9743f1c8dd5b2838ef2878a6685a0b" }
rattler_conda_types = { git = "https://github.com/greenroom-robotics/rattler", rev = "34ec0e6fae9743f1c8dd5b2838ef2878a6685a0b" }
rattler_config = { git = "https://github.com/greenroom-robotics/rattler", rev = "34ec0e6fae9743f1c8dd5b2838ef2878a6685a0b" }
rattler_digest = { git = "https://github.com/greenroom-robotics/rattler", rev = "34ec0e6fae9743f1c8dd5b2838ef2878a6685a0b" }
rattler_index = { git = "https://github.com/greenroom-robotics/rattler", rev = "34ec0e6fae9743f1c8dd5b2838ef2878a6685a0b" }
rattler_lock = { git = "https://github.com/greenroom-robotics/rattler", rev = "34ec0e6fae9743f1c8dd5b2838ef2878a6685a0b" }
rattler_macros = { git = "https://github.com/greenroom-robotics/rattler", rev = "34ec0e6fae9743f1c8dd5b2838ef2878a6685a0b" }
rattler_menuinst = { git = "https://github.com/greenroom-robotics/rattler", rev = "34ec0e6fae9743f1c8dd5b2838ef2878a6685a0b" }
rattler_networking = { git = "https://github.com/greenroom-robotics/rattler", rev = "34ec0e6fae9743f1c8dd5b2838ef2878a6685a0b" }
rattler_package_streaming = { git = "https://github.com/greenroom-robotics/rattler", rev = "34ec0e6fae9743f1c8dd5b2838ef2878a6685a0b" }
rattler_pty = { git = "https://github.com/greenroom-robotics/rattler", rev = "34ec0e6fae9743f1c8dd5b2838ef2878a6685a0b" }
rattler_redaction = { git = "https://github.com/greenroom-robotics/rattler", rev = "34ec0e6fae9743f1c8dd5b2838ef2878a6685a0b" }
rattler_shell = { git = "https://github.com/greenroom-robotics/rattler", rev = "34ec0e6fae9743f1c8dd5b2838ef2878a6685a0b" }
rattler_solve = { git = "https://github.com/greenroom-robotics/rattler", rev = "34ec0e6fae9743f1c8dd5b2838ef2878a6685a0b" }
simple_spawn_blocking = { git = "https://github.com/greenroom-robotics/rattler", rev = "34ec0e6fae9743f1c8dd5b2838ef2878a6685a0b" }
